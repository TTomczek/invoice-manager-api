openapi: 3.0.0
info:
    title: Invoice Manager API
    version: 1.0.0
    description: This is a simple API to manage invoices
servers:
    -   url: http://localhost:8080
        description: Local development server

paths:
    # Invoice
    /invoices:
        get:
            summary: Get all invoices
            tags:
                - Invoices
            operationId: getAllInvoices
            responses:
                '200':
                    description: A list of invoices
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Invoice'
        post:
            summary: Create a new invoice
            tags:
                - Invoices
            operationId: createInvoice
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Invoice'
            responses:
                '201':
                    description: The invoice was created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Invoice'
    /invoices/{id}:
        get:
            summary: Get an invoice by id
            tags:
                - Invoices
            operationId: getInvoiceById
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: The id of the invoice
                    schema:
                        type: integer
            responses:
                '200':
                    description: An invoice
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Invoice'
                '404':
                    description: Invoice with given id not found
        put:
            summary: Update an invoice
            tags:
                - Invoices
            operationId: updateInvoiceById
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: The id of the invoice
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Invoice'
            responses:
                '200':
                    description: The updated invoice
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Invoice'
                '404':
                    description: Invoice with given id not found
        delete:
            summary: Delete an invoice
            tags:
                - Invoices
            operationId: deleteInvoiceById
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: The id of the invoice
                    schema:
                        type: integer
            responses:
                '204':
                    description: The invoice was deleted
                '404':
                    description: Invoice with given id not found
