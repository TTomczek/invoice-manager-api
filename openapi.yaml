    # Files
    /files:
        post:
            summary: Upload a file
            tags:
                - Files
            operationId: uploadFile
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/File'
            responses:
                '201':
                    description: The file was uploaded
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/File'
    /files/{id}:
        get:
            summary: Download a file
            tags:
                - Files
            operationId: downloadFileById
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: The id of the file
                    schema:
                        type: integer
            responses:
                '200':
                    description: The file
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                '404':
                    description: File with given id not found

security:
    -   bearerAuth: []

components:
    schemas:
        SalesTax:
            type: object
            properties:
                id:
                    type: integer
                rate:
                    type: number
                name:
                    type: string
        InvoicePosition:
            type: object
            properties:
                id:
                    type: integer
                description:
                    type: string
                pricePerUnitInCents:
                    type: number
                quantity:
                    type: number
                    format: float
                unit:
                    type: string
                    enum: [ hour, pd, piece ]
                invoice:
                    type: integer
        InvoiceTemplate:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                marginTopFirstPage:
                    type: number
                    format: float
                marginBottomFirstPage:
                    type: number
                    format: float
                marginTopOtherPages:
                    type: number
                    format: float
                marginBottomOtherPages:
                    type: number
                    format: float
        ContactPerson:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                firstName:
                    type: string
                email:
                    type: string
                salutation:
                    type: string
                    enum: [ Frau, Herr, Divers ]
                address:
                    $ref: '#/components/schemas/Address'
                businessPartner:
                    type: integer
        BusinessPartner:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                description:
                    type: string
                address:
                    $ref: '#/components/schemas/Address'
                contactPersons:
                    type: array
                    items:
                        type: integer
                invoices:
                    type: array
                    items:
                        type: integer
        Address:
            type: object
            properties:
                street:
                    type: string
                number:
                    type: string
                zip:
                    type: string
                city:
                    type: string
                country:
                    type: string
        Invoice:
            type: object
            properties:
                id:
                    type: integer
                description:
                    type: string
                viaMail:
                    type: boolean
                preText:
                    type: string
                postText:
                    type: string
                serviceFrom:
                    type: string
                    format: date
                serviceTo:
                    type: string
                    format: date
                orderNumber:
                    type: string
                customerNumber:
                    type: integer
                positions:
                    type: array
                    items:
                        type: integer
                receiver:
                    type: integer
                salesTax:
                    type: integer
                invoiceTemplate:
                    type: integer
                file:
                    type: integer
        File:
            type: object
            properties:
                id:
                    type: integer
                fileType:
                    type: string
                    enum: [ template, invoice ]
                fileName:
                    type: string
                data:
                    type: string
                    format: binary
